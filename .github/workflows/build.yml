name: Build SST plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build
        run: dotnet build Jellyfin.Plugin.SST.sln -c Release

      - name: Package zip
        run: |
          mkdir -p dist
          zip -j dist/Jellyfin.Plugin.SST.zip Jellyfin.Plugin.SST/bin/Release/net9.0/Jellyfin.Plugin.SST.dll

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.SST
          path: dist/Jellyfin.Plugin.SST.zip
